spring.application.name=rag-gateway
server.port=${PORT:8080}

# Base URL of the deployed Python FastAPI retrieval service (Day 1-2)
rag.python-service.base-url=${PYTHON_SERVICE_URL:http://localhost:8000}
rag.python-service.timeout-ms=${PYTHON_SERVICE_TIMEOUT_MS:20000}

# Simple shared-secret auth for the gateway. Set a real value via env var when deploying.
rag.gateway.api-key=${GATEWAY_API_KEY:dev-local-key}

# Cache: how long an identical query+filters combo is served from memory before re-hitting Python
rag.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
rag.cache.max-size=${CACHE_MAX_SIZE:500}
